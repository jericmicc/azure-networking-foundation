name: terraform-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.5

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no Azure login)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Checkov (pinned)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install checkov==3.3.28

      - name: Scan Terraform
        run: /tmp/venv/bin/checkov -d infra --framework terraform

  tflint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.64.0

      - name: Install tflint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run tflint
        run: tflint
