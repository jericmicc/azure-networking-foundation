name: terraform-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no Azure login)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  security-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Checkov (pinned)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install checkov==3.3.28

      - name: Scan Terraform (report only for now)
        run: /tmp/venv/bin/checkov -d infra --framework terraform --soft-fail
